[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Pages the WordPress site had that are folded into others.
[[redirects]]
  from = "/main-page/"
  to = "/"
  status = 301

[[redirects]]
  from = "/2022/10/13/china-bike/"
  to = "/2022/10/13/bafang-front-wheel-handcycle/"
  status = 301

# Short link to Wojtek's booking calendar (same as the WordPress site).
[[redirects]]
  from = "/meetwithwojtek/"
  to = "https://calendar.app.google/H19MGHhiRnZwkM5J7"
  status = 302

[[redirects]]
  from = "/Blog/"
  to = "/blog/"
  status = 301

# WordPress addresses that have no page here.
[[redirects]]
  from = "/feed/*"
  to = "/rss.xml"
  status = 301

[[redirects]]
  from = "/category/uncategorized/"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301

# Images keep their names; the optimized copies under /img/ never change once
# built, so browsers may keep them.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
